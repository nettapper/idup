<div class="result-success">
    Update complete
    <table style="margin-top:1rem;font-size:0.95rem;line-height:1.8">
        <tr>
            <td style="text-align:right;padding-right:1rem">Verified:</td>
            <td><code>{{ verified }}</code></td>
        </tr>
        <tr>
            <td style="text-align:right;padding-right:1rem">Updated:</td>
            <td><code>{{ updated }}</code></td>
        </tr>
        <tr>
            <td style="text-align:right;padding-right:1rem">Missing:</td>
            <td><code>{{ missing }}</code></td>
        </tr>
        {% if show_cleaned %}
        <tr>
            <td style="text-align:right;padding-right:1rem">Cleaned:</td>
            <td><code>{{ cleaned }}</code></td>
        </tr>
        {% endif %}
    </table>
    <p class="muted" style="font-size:0.85rem;margin-top:1rem">{{ total }} files checked in {{ elapsed_secs }}s</p>
</div>
